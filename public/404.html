<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>صفحه پیدا نشد | نمونه‌کده</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0e0d12;
        color: #f5f2ea;
        font-family: 'Vazirmatn', Tahoma, 'Segoe UI', sans-serif;
        line-height: 1.9;
        text-align: center;
        padding: 2rem 1.25rem;
      }
      .code {
        font-size: clamp(3.5rem, 14vw, 7rem);
        font-weight: 900;
        color: #e2b06a;
        line-height: 1;
      }
      h1 {
        font-size: clamp(1.2rem, 4vw, 1.7rem);
        font-weight: 800;
        margin: 1rem 0 0.5rem;
      }
      p {
        color: rgba(245, 242, 234, 0.64);
        margin: 0 auto 1.8rem;
        max-width: 42ch;
      }
      a {
        display: inline-block;
        padding: 0.85rem 1.7rem;
        border-radius: 999px;
        background: linear-gradient(120deg, #e2b06a, #b0803c);
        color: #17110a;
        font-weight: 800;
        text-decoration: none;
      }
      a:hover {
        filter: brightness(1.08);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">۴۰۴</p>
      <h1>این صفحه پیدا نشد</h1>
      <p>احتمالاً آدرس اشتباهه یا صفحه جابه‌جا شده. از صفحه‌ی اصلی می‌تونید نمونه‌کارهام رو ببینید.</p>
      <a href="/">بازگشت به صفحه‌ی اصلی</a>
    </main>
  </body>
</html>
